<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inscription confirmée — AlerteRun</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏝️</text></svg>" />
<style>
  :root{
    --paper:#F5FAF9;
    --paper-raised:#FFFFFF;
    --ink:#152225;
    --ink-soft:#4B5F62;
    --line:#D9E4E2;
    --accent:#D3572A;
    --lagoon:#1C6E6E;
    --shadow: 0 1px 2px rgba(21,34,37,0.07), 0 8px 20px rgba(21,34,37,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#0F1618; --paper-raised:#182123; --ink:#E8F1EF; --ink-soft:#A9BCBC;
      --line:#26383A; --accent:#EE8354; --lagoon:#4FADAA;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 10px 26px rgba(0,0,0,0.35);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px;
  }
  .card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); max-width:480px; width:100%; padding:44px 36px; text-align:center;
  }
  .badge{
    width:56px; height:56px; border-radius:50%; background:var(--lagoon); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:26px; margin:0 auto 20px;
  }
  h1{font-size:1.5rem; margin:0 0 12px; letter-spacing:-0.01em;}
  p{font-family:Georgia,"Iowan Old Style",serif; font-size:1.05rem; color:var(--ink-soft); line-height:1.55; margin:0 0 24px;}
  a.back{
    display:inline-block; color:var(--accent); text-decoration:none; font-weight:700; font-size:0.95rem;
    border-bottom:2px solid var(--accent); padding-bottom:2px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">✓</div>
    <h1>C'est fait, vous êtes inscrit.</h1>
    <p>Vous recevrez un email dès qu'un vol entre la métropole et La Réunion passe vraiment sous le prix normal — rien d'autre, pas de newsletter quotidienne.</p>
    <a class="back" href="/">← Retour à AlerteRun</a>
  </div>
</body>
</html>
